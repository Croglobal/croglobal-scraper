name: Croglobal RSS Scraper

on:
  schedule:
    # Svakih 5 minuta (GitHub ne garantira apsolutnu točnost pod opterećenjem,
    # ali u praksi kasni tek koju minutu)
    - cron: "*/5 * * * *"
  workflow_dispatch: {}  # omogućuje ručno pokretanje s GitHub sučelja za testiranje

permissions:
  contents: write  # potrebno da workflow može commitati data/latest.json natrag

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install feedparser

      - name: Run scraper
        run: python scraper.py

      - name: Commit updated data
        run: |
          git config user.name "croglobal-scraper-bot"
          git config user.email "actions@github.com"
          git add data/latest.json
          git diff --staged --quiet || git commit -m "Auto-update: $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
